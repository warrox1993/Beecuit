name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jeton GITHUB_TOKEN en lecture seule : ce workflow ne fait que lire le code.
permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgres://placeholder:placeholder@localhost:5432/placeholder"
      AUTH_SECRET: "ci-placeholder-secret-at-least-32-characters-long"
      AUTH_RESEND_KEY: "re_placeholder_ci_key"
      AUTH_EMAIL_FROM: "BeeCuit <onboarding@resend.dev>"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Valeur factice (aucune vraie clé) : le client Stripe est instancié à
      # l'import, pendant la collecte des pages de `next build`, et refuse une
      # clé vide. Aucun appel Stripe n'est fait pendant la CI.
      STRIPE_SECRET_KEY: "sk_ci_placeholder"

    steps:
      # Actions épinglées par SHA de commit (version indiquée en commentaire) :
      # une étiquette peut être déplacée vers du code malveillant, pas un SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Tous les tests unitaires, sauf ceux qui exigent une vraie base Neon
      # (tests/integration et tests/unit/db.test.ts).
      - name: Unit tests (without DB)
        run: pnpm vitest run --exclude "tests/integration/**" --exclude tests/unit/db.test.ts

      - name: Build
        run: pnpm build
